<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset your QuillGlow password</title></head>
<body style="font-family:Arial,sans-serif;line-height:1.6;color:#222;background:#f8f7ff;padding:24px">
<table role="presentation" style="width:100%;max-width:560px;margin:auto;background:white;border-radius:12px"><tr><td style="padding:24px">
<h1 style="font-size:22px">Reset your QuillGlow password</h1><p>You requested this action on QuillGlow.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next=/auth/reset-password" style="background:#7c3aed;color:white;padding:12px 18px;border-radius:8px;display:inline-block">Reset password</a></p>
<p>This link can be used once and expires. If you did not request this, you can ignore this email.</p>
</td></tr></table></body></html>
